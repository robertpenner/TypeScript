SPECIFICATION Spec

CONSTANTS
    Checkers = {w1, w2}
    Symbols = {"s1", "s2"}
    MaxVer = 2
    UseEpochGuard = TRUE

\* Note: SYMMETRY Symmetry is sound for safety-only runs (reduces 3,274 -> 1,711
\* distinct states), but must be disabled when checking liveness PROPERTIES in TLC.
\* Checking per-worker temporal formulas (\A w : ... ~> ...) under Permutations(Checkers)
\* is unsound in TLC and produces spurious quotient-graph counterexamples.
\* SYMMETRY Symmetry

INVARIANTS
    TypeOK
    NoStaleCacheEntry
    NoStaleRead
    NoTornSnapshot

PROPERTIES
    WorkersMakeProgress
